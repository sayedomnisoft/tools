<script>
(function () {
  var Q = new URLSearchParams(location.search), u = Q.get('u') || '';

     Source order: ?s= on the link, then the referring site, then the source track.js stored on a tools page (30 days).
     Tags already on the link (added on a tools page) are kept. */
  try {
    var clean = function (v) { return String(v || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40); };
    var ref = document.referrer || '', rh = '', page = 'link', src = clean(Q.get('s'));

    else if (rh && !src) {
      var M = [[/youtube\.com$|youtu\.be$/, 'yt'], [/substack\.com$|^gantry\.work$/, 'ss'], [/(^|\.)google\./, 'google'], [/bing\.com$/, 'bing'],

      for (var i = 0; i < M.length && !src; i++) if (M[i][0].test(rh)) src = M[i][1];
      if (!src) src = 'ref-' + clean(rh.split('.').slice(-2, -1)[0]);
    }
    if (!src) { try { var o = JSON.parse(localStorage.getItem('gantry_src') || 'null'); if (o && o.s && Date.now() - o.t < 30 * 864e5) src = o.s; } catch (e) {} }

  var BOT = navigator.webdriver || /bot|crawl|spider|slurp|headless|lighthouse|preview|scan|monitor|fetch|gpt|claude|perplexity|bytespider|python|curl|wget|httpclient/i.test(navigator.userAgent || '');
